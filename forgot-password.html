<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — CV Central</title>
  <meta name="description" content="Reset your CV Central password.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="CV Central home">
        <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="4" y="20" width="7" height="14" rx="2" fill="#5B2D8E"/>
          <rect x="14" y="12" width="7" height="22" rx="2" fill="#7B4DB8"/>
          <rect x="24" y="4" width="7" height="30" rx="2" fill="#AAFF00"/>
        </svg>
        <span style="font-family:'Fraunces',Georgia,serif;font-weight:600;">CV<span class="logo-central">Central</span></span>
      </a>
      <nav class="main-nav">
        <a href="login.html" class="btn btn-ghost btn-sm">Back to sign in</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="4" y="20" width="7" height="14" rx="2" fill="#5B2D8E"/>
          <rect x="14" y="12" width="7" height="22" rx="2" fill="#7B4DB8"/>
          <rect x="24" y="4" width="7" height="30" rx="2" fill="#AAFF00"/>
        </svg>
        <span style="font-family:'Fraunces',Georgia,serif;font-weight:600;">CV<span class="logo-central">Central</span></span>
      </a>

      <!-- Form state -->
      <div id="formState">
        <h1 style="font-family:'Fraunces',Georgia,serif;font-weight:600;">Forgot your password?</h1>
        <p>Enter the email you signed up with and we'll send you a reset link.</p>

        <div id="errorBanner" class="field-error" style="background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:0.7rem 0.9rem;font-size:0.88rem;margin-bottom:1rem;display:none;"></div>

        <form class="auth-form" id="forgotForm" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <button type="submit" class="btn btn-violet" id="submitBtn" style="width:100%;">Send reset link</button>
        </form>

        <p class="auth-footer" style="margin-top:1.25rem;"><a href="login.html">← Back to sign in</a></p>
      </div>

      <!-- Success state -->
      <div id="successState" class="auth-success" hidden>
        <div class="success-icon">✉</div>
        <h2 style="font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.5rem;">Check your inbox</h2>
        <p style="color:var(--muted);font-size:0.92rem;margin-bottom:1.25rem;">We've sent a password reset link to <strong id="sentTo"></strong>. It expires in one hour.</p>
        <a href="login.html" class="btn btn-ghost btn-sm" style="display:inline-flex;">Back to sign in</a>
        <p style="margin-top:1rem;font-size:0.82rem;color:var(--muted);">Didn't receive it? Check your spam folder or <button id="resendBtn" style="background:none;border:none;color:var(--violet);font-weight:700;cursor:pointer;font-size:0.82rem;padding:0;">resend</button>.</p>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
  (function () {
    'use strict';

    var toastEl = document.getElementById('toast');
    var toastTimer = null;
    function toast(msg, type) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3500);
    }

    function showError(msg) {
      var banner = document.getElementById('errorBanner');
      banner.textContent = msg;
      banner.style.display = msg ? 'block' : 'none';
    }

    var lastEmail = '';

    document.getElementById('forgotForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      showError('');

      var email = document.getElementById('email').value.trim();
      var btn = document.getElementById('submitBtn');

      if (!email) { showError('Please enter your email address.'); return; }

      btn.disabled = true;
      btn.textContent = 'Sending…';
      lastEmail = email;

      try {
        var res = await cvAuth.client.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://cvcentral.io/reset-password.html'
        });
        if (res.error) throw res.error;

        document.getElementById('sentTo').textContent = email;
        document.getElementById('formState').hidden = true;
        document.getElementById('successState').hidden = false;
      } catch (err) {
        // Supabase returns success even for unknown emails (security best practice)
        // so we only error on genuine failures
        document.getElementById('sentTo').textContent = email;
        document.getElementById('formState').hidden = true;
        document.getElementById('successState').hidden = false;
      }
    });

    document.getElementById('resendBtn').addEventListener('click', async function () {
      if (!lastEmail) return;
      this.textContent = 'Sending…';
      var res = await cvAuth.client.auth.resetPasswordForEmail(lastEmail, {
        redirectTo: 'https://cvcentral.io/reset-password.html'
      });
      this.textContent = 'Sent!';
    });
  })();
  </script>
</body>
</html>
