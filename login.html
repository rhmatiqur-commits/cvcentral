<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — CV Central</title>
  <meta name="description" content="Sign in to your CV Central account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%235B2D8E'/><text x='50' y='68' font-size='48' font-family='monospace' font-weight='bold' fill='%23AAFF00' text-anchor='middle'>CV</text></svg>">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="CV Central home">
        <span class="logo-mark">CV</span>
        <span>CV<span class="logo-central">Central</span></span>
      </a>
      <nav class="main-nav">
        <span style="font-size:0.9rem;color:var(--muted);">No account?</span>
        <a href="signup.html" class="btn btn-primary btn-sm">Sign up free</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <span class="logo-mark" style="width:38px;height:38px;font-size:0.9rem;">CV</span>
        <span>CV<span class="logo-central">Central</span></span>
      </a>

      <h1>Welcome back</h1>
      <p>Sign in to your CV Central account.</p>

      <div id="errorBanner" class="field-error" style="background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:0.7rem 0.9rem;font-size:0.88rem;margin-bottom:1rem;display:none;"></div>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="field">
          <div class="auth-row">
            <label for="password">Password</label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <label class="checkbox-field">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          Keep me signed in
        </label>

        <button type="submit" class="btn btn-violet" id="submitBtn" style="width:100%;margin-top:0.25rem;">Sign in</button>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <div class="social-btns">
        <button class="social-btn" id="googleBtn">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="social-btn" id="linkedinBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#0A66C2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
          LinkedIn
        </button>
      </div>

      <p class="auth-footer">No account? <a href="signup.html">Sign up free →</a></p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
  (function () {
    'use strict';

    // If already signed in, redirect to dashboard
    cvAuth.getSession().then(function (session) {
      if (session) window.location.href = 'dashboard.html';
    });

    var toastEl = document.getElementById('toast');
    var toastTimer = null;
    function toast(msg, type) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3500);
    }

    function showError(msg) {
      var banner = document.getElementById('errorBanner');
      banner.textContent = msg;
      banner.style.display = msg ? 'block' : 'none';
    }

    var pwInput = document.getElementById('password');
    document.getElementById('pwToggle').addEventListener('click', function () {
      var isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      this.querySelector('circle') && (this.innerHTML = isText
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>');
    });

    document.getElementById('googleBtn').addEventListener('click', async function () {
      this.disabled = true;
      this.textContent = 'Redirecting…';
      var res = await cvAuth.signInWithProvider('google');
      if (res.error) { showError(res.error.message); this.disabled = false; this.textContent = 'Google'; }
    });

    document.getElementById('linkedinBtn').addEventListener('click', async function () {
      this.disabled = true;
      this.textContent = 'Redirecting…';
      var res = await cvAuth.signInWithProvider('linkedin_oidc');
      if (res.error) { showError(res.error.message); this.disabled = false; this.textContent = 'LinkedIn'; }
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      showError('');

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var btn = document.getElementById('submitBtn');

      if (!email || !password) { showError('Please fill in all fields.'); return; }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        var res = await cvAuth.client.auth.signInWithPassword({ email: email, password: password });
        if (res.error) throw res.error;

        // Return to wherever the user was, or go to dashboard
        var returnTo = new URLSearchParams(window.location.search).get('returnTo');
        window.location.href = returnTo || 'dashboard.html';
      } catch (err) {
        showError(err.message === 'Invalid login credentials'
          ? 'Incorrect email or password.'
          : (err.message || 'Sign-in failed. Please try again.'));
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  })();
  </script>

  <!-- Cookie consent banner -->
  <div class="cookie-banner" id="cookieBanner" hidden>
    <div class="cookie-inner">
      <div class="cookie-logo">
        <span class="logo-mark" style="width:28px;height:28px;font-size:0.7rem;">CV</span>
      </div>
      <p class="cookie-text">We use essential cookies to keep you logged in and analytics cookies to improve CV Central. See our <a href="privacy.html">Privacy Policy</a> for details.</p>
      <div class="cookie-actions">
        <button class="btn-cookie-accept" id="cookieAcceptAll">Accept All</button>
        <button class="btn-cookie-essential" id="cookieEssentialOnly">Essential Only</button>
      </div>
    </div>
  </div>
  <script>
  (function() {
    if (!localStorage.getItem('cvcentral_cookie_choice')) {
      document.getElementById('cookieBanner').hidden = false;
    }
    document.getElementById('cookieAcceptAll').addEventListener('click', function() {
      localStorage.setItem('cvcentral_cookie_choice', 'all');
      document.getElementById('cookieBanner').hidden = true;
    });
    document.getElementById('cookieEssentialOnly').addEventListener('click', function() {
      localStorage.setItem('cvcentral_cookie_choice', 'essential');
      document.getElementById('cookieBanner').hidden = true;
    });
  })();
  </script>
</body>
</html>
