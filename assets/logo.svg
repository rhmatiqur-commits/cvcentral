<svg width="260" height="56" viewBox="0 0 260 56" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <!-- Icon border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B6DD8"/>
      <stop offset="100%" stop-color="#5B2D8E"/>
    </linearGradient>
    <!-- Lime glow -->
    <filter id="limeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Violet node glow -->
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- ── Icon mark ── -->
  <!-- Outer glow -->
  <rect x="1" y="1" width="54" height="54" rx="14" fill="#5B2D8E" fill-opacity="0.15"/>
  <!-- Card background -->
  <rect x="2" y="2" width="52" height="52" rx="13" fill="#0A0A14"/>
  <!-- Gradient border -->
  <rect x="1.5" y="1.5" width="53" height="53" rx="13.5" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Neural network lines -->
  <line x1="13" y1="17" x2="29" y2="11" stroke="#7B4DB8" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="29" y1="11" x2="43" y2="20" stroke="#7B4DB8" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="43" y1="20" x2="44" y2="36" stroke="#5B2D8E" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="13" y1="17" x2="11" y2="36" stroke="#7B4DB8" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="11" y1="36" x2="27" y2="44" stroke="#5B2D8E" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="27" y1="44" x2="44" y2="36" stroke="#7B4DB8" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="13" y1="17" x2="27" y2="44" stroke="#5B2D8E" stroke-width="0.8" stroke-opacity="0.25"/>
  <line x1="29" y1="11" x2="44" y2="36" stroke="#7B4DB8" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Node glow halos -->
  <circle cx="29" cy="11" r="4" fill="#AAFF00" fill-opacity="0.1" filter="url(#nodeGlow)"/>
  <circle cx="11" cy="36" r="4" fill="#7B4DB8" fill-opacity="0.3" filter="url(#nodeGlow)"/>
  <circle cx="44" cy="36" r="4" fill="#7B4DB8" fill-opacity="0.3" filter="url(#nodeGlow)"/>

  <!-- Neural nodes -->
  <circle cx="13" cy="17" r="2.2" fill="#7B4DB8"/>
  <circle cx="29" cy="11" r="2.5" fill="#AAFF00" fill-opacity="0.9"/>
  <circle cx="43" cy="20" r="2" fill="#7B4DB8"/>
  <circle cx="11" cy="36" r="2" fill="#5B2D8E"/>
  <circle cx="27" cy="44" r="2.2" fill="#7B4DB8"/>
  <circle cx="44" cy="36" r="2" fill="#5B2D8E"/>

  <!-- CV text with lime glow -->
  <text x="28" y="37" font-family="'JetBrains Mono','Courier New',monospace" font-weight="800" font-size="21" fill="#AAFF00" text-anchor="middle" filter="url(#limeGlow)">CV</text>

  <!-- ── Wordmark ── -->
  <!-- "CV" bold white -->
  <text x="70" y="37" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="-0.8">CV</text>
  <!-- "Central" regular, muted white -->
  <text x="103" y="37" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="400" font-size="24" fill="#CCCCDD" letter-spacing="-0.4">Central</text>

  <!-- Lime dot accent under CV -->
  <circle cx="82" cy="44" r="2.5" fill="#AAFF00" fill-opacity="0.85"/>
</svg>
