<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B6DD8"/>
      <stop offset="100%" stop-color="#5B2D8E"/>
    </linearGradient>
    <filter id="limeGlow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Outer glow -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#5B2D8E" fill-opacity="0.2"/>
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0A0A14"/>
  <!-- Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" stroke="url(#borderGrad2)" stroke-width="1.5"/>

  <!-- Neural lines -->
  <line x1="14" y1="19" x2="32" y2="11" stroke="#7B4DB8" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="32" y1="11" x2="50" y2="22" stroke="#7B4DB8" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="50" y1="22" x2="51" y2="42" stroke="#5B2D8E" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="14" y1="19" x2="13" y2="42" stroke="#7B4DB8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="13" y1="42" x2="32" y2="52" stroke="#5B2D8E" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="32" y1="52" x2="51" y2="42" stroke="#7B4DB8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="14" y1="19" x2="32" y2="52" stroke="#5B2D8E" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="32" y1="11" x2="51" y2="42" stroke="#7B4DB8" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Node halos -->
  <circle cx="32" cy="11" r="6" fill="#AAFF00" fill-opacity="0.15" filter="url(#nodeGlow2)"/>
  <circle cx="13" cy="42" r="5" fill="#7B4DB8" fill-opacity="0.4" filter="url(#nodeGlow2)"/>
  <circle cx="51" cy="42" r="5" fill="#7B4DB8" fill-opacity="0.4" filter="url(#nodeGlow2)"/>

  <!-- Neural nodes -->
  <circle cx="14" cy="19" r="2.8" fill="#7B4DB8"/>
  <circle cx="32" cy="11" r="3" fill="#AAFF00" fill-opacity="0.9"/>
  <circle cx="50" cy="22" r="2.5" fill="#7B4DB8"/>
  <circle cx="13" cy="42" r="2.5" fill="#5B2D8E"/>
  <circle cx="32" cy="52" r="2.8" fill="#7B4DB8"/>
  <circle cx="51" cy="42" r="2.5" fill="#5B2D8E"/>

  <!-- CV text -->
  <text x="32" y="42" font-family="'JetBrains Mono','Courier New',monospace" font-weight="800" font-size="24" fill="#AAFF00" text-anchor="middle" filter="url(#limeGlow2)">CV</text>
</svg>
