<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password — CV Central</title>
  <meta name="description" content="Set a new password for your CV Central account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="CV Central home">
        <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="4" y="20" width="7" height="14" rx="2" fill="#5B2D8E"/>
          <rect x="14" y="12" width="7" height="22" rx="2" fill="#7B4DB8"/>
          <rect x="24" y="4" width="7" height="30" rx="2" fill="#AAFF00"/>
        </svg>
        <span style="font-family:'Fraunces',Georgia,serif;font-weight:600;">CV<span class="logo-central">Central</span></span>
      </a>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="4" y="20" width="7" height="14" rx="2" fill="#5B2D8E"/>
          <rect x="14" y="12" width="7" height="22" rx="2" fill="#7B4DB8"/>
          <rect x="24" y="4" width="7" height="30" rx="2" fill="#AAFF00"/>
        </svg>
        <span style="font-family:'Fraunces',Georgia,serif;font-weight:600;">CV<span class="logo-central">Central</span></span>
      </a>

      <!-- Invalid/expired state -->
      <div id="invalidState" hidden>
        <h1 style="font-size:1.45rem;font-family:'Fraunces',Georgia,serif;font-weight:600;">Link expired</h1>
        <p>This password reset link has expired or is invalid. Request a new one.</p>
        <a href="forgot-password.html" class="btn btn-violet" style="display:inline-flex;margin-top:0.5rem;">Request new link</a>
      </div>

      <!-- Form state -->
      <div id="formState" hidden>
        <h1 style="font-family:'Fraunces',Georgia,serif;font-weight:600;">Set new password</h1>
        <p>Choose a strong password for your account.</p>

        <div id="errorBanner" class="field-error" style="background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:0.7rem 0.9rem;font-size:0.88rem;margin-bottom:1rem;display:none;"></div>

        <form class="auth-form" id="resetForm" novalidate>
          <div class="field">
            <label for="password">New password</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="pw-strength" id="pwStrength" data-level="0">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <div class="pw-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Same password again" autocomplete="new-password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-violet" id="submitBtn" style="width:100%;">Set new password</button>
        </form>
      </div>

      <!-- Success state -->
      <div id="successState" class="auth-success" hidden>
        <div class="success-icon">✓</div>
        <h2 style="font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.5rem;">Password updated</h2>
        <p style="color:var(--muted);font-size:0.92rem;margin-bottom:1.25rem;">Your new password is set. You can now sign in.</p>
        <a href="dashboard.html" class="btn btn-violet" style="display:inline-flex;">Go to my dashboard</a>
      </div>

      <!-- Loading state -->
      <div id="loadingState" style="text-align:center;padding:2rem 0;color:var(--muted);">
        Verifying your link…
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
  (function () {
    'use strict';

    var toastEl = document.getElementById('toast');
    var toastTimer = null;
    function toast(msg, type) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3500);
    }

    function show(id) {
      ['loadingState','invalidState','formState','successState'].forEach(function (s) {
        document.getElementById(s).hidden = s !== id;
      });
    }

    function showError(msg) {
      var banner = document.getElementById('errorBanner');
      banner.textContent = msg;
      banner.style.display = msg ? 'block' : 'none';
    }

    // Password visibility toggle
    document.getElementById('pwToggle').addEventListener('click', function () {
      var input = document.getElementById('password');
      input.type = input.type === 'text' ? 'password' : 'text';
    });

    // Password strength
    document.getElementById('password').addEventListener('input', function () {
      var v = this.value;
      var score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      document.getElementById('pwStrength').dataset.level = v.length ? score : 0;
    });

    // On load: check if this is a recovery session
    // Supabase v2 browser client auto-exchanges the PKCE code in ?code= or handles #access_token
    cvAuth.client.auth.onAuthStateChange(function (event, session) {
      if (event === 'PASSWORD_RECOVERY') {
        // User arrived via reset link — show the form
        show('formState');
      }
    });

    // Fallback: check for a session after a moment (handles both PKCE and implicit flows)
    setTimeout(async function () {
      var session = await cvAuth.getSession();
      var loadingEl = document.getElementById('loadingState');
      if (loadingEl && !loadingEl.hidden) {
        if (session) {
          show('formState');
        } else {
          show('invalidState');
        }
      }
    }, 1500);

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      showError('');

      var password = document.getElementById('password').value;
      var confirm = document.getElementById('confirmPassword').value;
      var btn = document.getElementById('submitBtn');

      if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        var res = await cvAuth.client.auth.updateUser({ password: password });
        if (res.error) throw res.error;
        show('successState');
      } catch (err) {
        showError(err.message || 'Could not update password. Please request a new reset link.');
        btn.disabled = false;
        btn.textContent = 'Set new password';
      }
    });
  })();
  </script>
</body>
</html>
